url: https://www.demoblaze.com
name: TS_009 - Validate the Place Order functionality
tags:
  - P0
  - order
env:
  USERNAME: test          # existing account; override with -e
  PASSWORD: test
---
- runFlow: ../subflows/open_home.yaml
- takeScreenshot: 01_home_page
- runFlow:
    file: ../subflows/add_to_cart.yaml
    env:
      PRODUCT_ID: "1"
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
- tapOn: "Cart"
- extendedWaitUntil:
    visible: "Samsung galaxy s6"
    timeout: 10000
- tapOn: "Place Order"
- assertVisible: "Place order"

# TC_009_01: Order with valid data
- tapOn:
    id: "name"
- inputText: "QA Tester"
- tapOn:
    id: "country"
- inputText: "India"
- tapOn:
    id: "city"
- inputText: "Jaipur"
- tapOn:
    id: "card"
- inputText: "4111111111111111"
- tapOn:
    id: "month"
- inputText: "12"
- tapOn:
    id: "year"
- inputText: "2030"
- takeScreenshot: 02_order_form_filled
- tapOn: "Purchase"
- assertVisible: "Thank you for your purchase!"
- takeScreenshot: 03_purchase_confirmation
- tapOn: "OK"
- assertVisible: "CATEGORIES"

# TODO TC_009_02-08: empty name/card, close modal, cancel, amount/id shown, cart cleared after purchase
- takeScreenshot: 99_final_state
