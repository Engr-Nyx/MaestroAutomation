url: https://www.demoblaze.com
name: TS_002 - Validate the Login functionality
tags:
  - P0
  - login
env:
  USERNAME: test          # existing account; override with -e
  PASSWORD: test
---
- runFlow: ../subflows/open_home.yaml

# TC_002_01: Login modal opens
- tapOn: "Log in"
- assertVisible: "Username:"
- assertVisible: "Password:"
- tapOn: "Close"

# TC_002_02: Login with valid credentials
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

