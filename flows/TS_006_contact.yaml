url: https://www.demoblaze.com
name: TS_006 - Validate the Contact functionality
tags:
  - P2
  - contact
---
- runFlow: ../subflows/open_home.yaml
- takeScreenshot: 01_home_page

# TC_006_01: Contact modal opens
- tapOn: "Contact"
- assertVisible: "New message"

# TC_006_02: Send message with valid data
- tapOn:
    id: "recipient-email"
- inputText: "qa@example.com"
- tapOn:
    id: "recipient-name"
- inputText: "QA Tester"
- tapOn:
    id: "message-text"
- inputText: "Automation test message"
# "Send message" raises a native alert that blocks Maestro web, so stop before submitting.
- takeScreenshot: 02_contact_form_filled
- assertVisible: "Send message"
- tapOn: "Close"
- assertNotVisible: "New message"

# TODO TC_006_03: empty fields
# TODO TC_006_04: close modal
- takeScreenshot: 99_final_state
