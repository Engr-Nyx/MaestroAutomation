url: https://www.demoblaze.com
name: TS_008 - Validate the Shopping Cart functionality
tags:
  - P0
  - cart
env:
  USERNAME: test          # existing account; override with -e
  PASSWORD: test
---
- runFlow: ../subflows/open_home.yaml
- takeScreenshot: 01_home_page

# TC_008_01: Add product to cart (product 1 = Samsung galaxy s6)
- runFlow:
    file: ../subflows/add_to_cart.yaml
    env:
      PRODUCT_ID: "1"
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# TC_008_02: Product shown in cart with price and total
- tapOn: "Cart"
- extendedWaitUntil:
    visible: "Samsung galaxy s6"
    timeout: 10000
- assertVisible: "360"
- assertVisible: "Total"

# TC_008_03: Delete product from cart
- takeScreenshot: 02_cart_with_product
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Samsung galaxy s6"
    timeout: 10000

# TODO TC_008_04: add multiple products, total is sum
# TODO TC_008_05: cart persists after refresh
# TODO TC_008_06: Place Order button visible
- takeScreenshot: 99_final_state
