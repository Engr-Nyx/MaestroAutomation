url: https://www.demoblaze.com
name: TS_010 - Validate the Logout functionality
tags:
  - P1
  - logout
env:
  USERNAME: test
  PASSWORD: test
---
- runFlow: ../subflows/open_home.yaml
- takeScreenshot: 01_home_page
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# TC_010_01: Logout
- takeScreenshot: 02_logged_in
- tapOn: "Log out"
- assertVisible: "Log in"
- assertVisible: "Sign up"
- assertNotVisible: "Welcome ${USERNAME}"

# TC_010_02: Session cleared after refresh
- openLink: https://www.demoblaze.com
- assertVisible: "Log in"
- takeScreenshot: 99_final_state
