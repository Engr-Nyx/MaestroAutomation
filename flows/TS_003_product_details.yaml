url: https://www.demoblaze.com
name: TS_003 - Validate product details (name, image, description, price)
tags:
  - P1
  - product
---
- runFlow: ../subflows/open_home.yaml
- takeScreenshot: 01_home_page
- assertVisible: "Samsung galaxy s6"

# Tapping the product link doesn't navigate under Maestro web, so open the page directly.
- openLink: https://www.demoblaze.com/prod.html?idp_=1

# Name, price, description, image, Add to cart
- extendedWaitUntil:
    visible: "Add to cart"
    timeout: 10000
- assertVisible: "Samsung galaxy s6"
- assertVisible: "\\$360.*"
- assertVisible: "Product description"
- assertVisible:
    id: "imgp"
- takeScreenshot: 99_final_state
