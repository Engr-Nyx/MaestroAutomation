name: Maestro Web Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: "Maestro tags to include (e.g. P0 or P0,P1). Empty = all"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Allow Chrome sandbox on Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Maestro flows
        id: maestro
        continue-on-error: true   # still build and publish the report on failures
        env:
          TAGS: ${{ github.event.inputs.tags }}
          USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
        run: |
          mkdir -p allure-results maestro-debug
          ARGS=""
          [ -n "$TAGS" ] && ARGS="--include-tags=$TAGS"
          [ -n "$USERNAME" ] && ARGS="$ARGS -e USERNAME=$USERNAME -e PASSWORD=$PASSWORD"
          maestro test flows/ --headless \
            --format junit --output allure-results/maestro-junit.xml \
            --debug-output maestro-debug --flatten-debug-output \
            $ARGS

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            allure-results
            maestro-debug
          include-hidden-files: true
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.maestro.outcome == 'failure'
        run: exit 1

  report:
    needs: test
    if: >-
      always() && (
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: .

      - name: Ensure results folder exists
        run: mkdir -p allure-results

      - name: Restore Allure history (trend graphs)
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Copy history into results
        run: |
          [ -d allure-history ] && cp -r allure-history allure-results/history || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
          rm -rf allure-history
          cp -r allure-report/history allure-history || true
          touch allure-report/.nojekyll

      - name: Save Allure history
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
