name: Maestro Web Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: "Maestro tags to include (e.g. P0 or P0,P1). Empty = all"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write   # push report to gh-pages
  pages: write
  id-token: write

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Allow Chrome sandbox on Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Maestro flows
        env:
          TAGS: ${{ github.event.inputs.tags }}
          USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
        run: |
          mkdir -p allure-results
          ARGS=""
          [ -n "$TAGS" ] && ARGS="--include-tags=$TAGS"
          [ -n "$USERNAME" ] && ARGS="$ARGS -e USERNAME=$USERNAME -e PASSWORD=$PASSWORD"
          maestro test flows/ --headless \
            --format junit --output allure-results/maestro-junit.xml \
            --debug-output maestro-debug --flatten-debug-output \
            $ARGS

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            allure-results
            maestro-debug

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: .

      - name: Load previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into results
        run: |
          mkdir -p allure-results
          [ -d gh-pages/history ] && cp -r gh-pages/history allure-results/history || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
          # keep history for trend graphs on the next run
          cp -r allure-report/history allure-report/history-keep 2>/dev/null || true

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false
