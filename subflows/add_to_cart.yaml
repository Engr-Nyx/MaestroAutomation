url: https://www.demoblaze.com
env:
  PRODUCT_ID: ${PRODUCT_ID}
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# The UI "Add to cart" raises a native alert that blocks Maestro web, so the product is
# added through the API. Log in through the UI afterwards to see it in the cart.
- runScript:
    file: ../scripts/api_add_to_cart.js
    env:
      PRODUCT_ID: ${PRODUCT_ID}
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
