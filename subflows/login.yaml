url: https://www.demoblaze.com
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
- tapOn: "Log in"
- tapOn:
    id: "loginusername"
- inputText: ${USERNAME}
- tapOn:
    id: "loginpassword"
- inputText: ${PASSWORD}
- tapOn:
    text: "Log in"
    below:
      id: "loginpassword"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Welcome ${USERNAME}"
